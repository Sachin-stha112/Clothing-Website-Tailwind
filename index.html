        <a href="#" class="text-[22px] font-['Cormorant_Garamond'] ml-8 underline underline-offset-[6px] decoration-[1.5px]">New In</a>

      </div>

    </section>

    <script>
      const navbar = document.getElementById("navbar");
      const navLogo = document.getElementById("nav-logo");
      const navLinks = document.querySelectorAll(".nav-link");
      const navIcons = document.querySelectorAll(".nav-icon");

      // Scrolled past hero → solid white navbar with black text/icons
      // At top → transparent navbar with white text/icons over the banner
      window.addEventListener("scroll", () => {
        if (window.scrollY > 50) {
          navbar.classList.add("bg-white", "shadow-md");
          navbar.classList.remove("bg-transparent");
          navLogo.classList.remove("brightness-0", "invert");
          navLinks.forEach((link) => link.classList.add("text-black"));
          navIcons.forEach((icon) => icon.classList.add("stroke-black"));
        } else {
          navbar.classList.remove("bg-white", "shadow-md");
          navbar.classList.add("bg-transparent");
          navLogo.classList.add("brightness-0", "invert");
          navLinks.forEach((link) => link.classList.remove("text-black"));
          navIcons.forEach((icon) => icon.classList.remove("stroke-black"));
        }
      });

      // Fire once on load so the correct state is set immediately
      window.dispatchEvent(new Event("scroll"));
    </script>
